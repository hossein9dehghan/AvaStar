name: Validate AvaStar
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm design:tokens
      - run: pnpm design:check
      - run: pnpm test
      - run: pnpm --filter @avastar/web lint
      - run: pnpm --filter @avastar/design-system lint
      - run: pnpm design:kit
      - run: pnpm build
